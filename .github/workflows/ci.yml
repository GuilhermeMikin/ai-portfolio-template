# The same checks as the "Definition of done" in AGENTS.md, on every push to main and every pull
# request. No secrets are needed: without an LLM key the build has the chat off, as a fresh clone does.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The minimum in package.json "engines" and the current LTS.
        node: [22, 24]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Installs the pnpm version pinned in "packageManager" (package.json). Third-party
      # action pinned to a commit; Dependabot (.github/dependabot.yml) keeps it current.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Content check
        run: pnpm content:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Tailwind opacity scale
        run: pnpm tailwind:check

      # `pnpm build` runs the content check again before `next build`.
      - name: Build
        run: pnpm build
